<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <meta name="google" value="notranslate">
  <link rel="shortcut icon" href="static/favicon.ico">
  <title>
    MineCratch 1.20.1
  </title>

  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-EG3CDDF14D"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-EG3CDDF14D');
  </script>
  <style>
    /* ===== 調整可能な設定値 ===== */
    :root {
      /* ブロックエリア（パレット）の白みオーバーレイの透明度 (0.0〜1.0) */
      /* 0.0 = 完全に透明（白みなし）, 1.0 = 完全に白い */
      --flyout-overlay-opacity: 0.2;

      /* コードエリア（ワークスペース）の白みオーバーレイの透明度 (0.0〜1.0) */
      /* 0.0 = 完全に透明（白みなし）, 1.0 = 完全に白い */
      --workspace-overlay-opacity: 0.7;

      /* ブロックエリア（パレット）の幅 (デフォルト: 250px、1.5倍: 375px) */
      --flyout-width: 255px;
    }

    /* ステージ削除・全体最大化（継続） */
    [class*="gui_stage-and-target-wrapper"],
    [class*="gui_tab-list"] {
      display: none !important;
    }

    [class*="gui_body-wrapper"],
    [class*="gui_flex-wrapper"] {
      width: 100% !important;
      display: flex !important;
    }

    [class*="gui_flex-wrapper"] {
      flex-direction: row !important;
      height: calc(100vh - 48px) !important;
    }

    [class*="gui_blocks-wrapper"] {
      display: block !important;
      flex-grow: 1 !important;
      height: 100% !important;
    }

    /* ===== マインクラフト風テクスチャ ===== */

    /* 1. メニューバー - 石ブロック風テクスチャ */
    [class*="menu-bar_menu-bar"] {
      background-image: url('static/assets/stone_block_texture.png') !important;
      background-size: 64px 64px !important;
      background-repeat: repeat !important;
      border-top: 3px solid #2d5a1b !important;
      border-bottom: 3px solid #1a3d10 !important;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.2), inset 0 -2px 4px rgba(0, 0, 0, 0.3) !important;
      image-rendering: pixelated !important;
    }

    /* メニューバーのテキストを見やすくする */
    [class*="menu-bar_menu-bar"] * {
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7) !important;
    }

    /* 2. チュートリアル、共有する、プロジェクトページを見るを非表示 */
    [class*="menu-bar_account-info-group"],
    [class*="menu-bar_divider"],
    [class*="share-button_share-button"],
    [class*="menu-bar_menu-bar-item"][class*="community-button"],
    [class*="community-button"],
    [class*="see-project-page"] {
      display: none !important;
      visibility: hidden !important;
      width: 0 !important;
      opacity: 0 !important;
    }

    /* チュートリアルボタンを非表示 */
    button[class*="action-menu_button"][aria-label*="Tutorials"],
    button[class*="action-menu_button"][aria-label*="チュートリアル"],
    [class*="tutorials-button"],
    [class*="menu-bar_help-menu"] {
      display: none !important;
    }

    /* 3. バックパック（画面下部）を完全に消す */
    [class*="backpack_backpack-container"] {
      display: none !important;
    }

    /* 4. コードエリア右上の半透明スプライト画像を消す */
    [class*="gui_watermark"] {
      display: none !important;
    }

    /* 5. コードエリア（パレット） - 白色の羊毛風テクスチャ */
    /* SVGパターンが効かない場合のフォールバック */
    .blocklySvg {
      background-image: url('static/assets/White_Wool_texture.png') !important;
      background-size: 64px 64px !important;
      background-repeat: repeat !important;
      image-rendering: pixelated !important;
    }

    /* コードエリアの白みオーバーレイ（調整可能） */
    .blocklyMainBackground {
      fill: #ffffff !important;
      fill-opacity: var(--workspace-overlay-opacity) !important;
    }

    /* 6. ブロックエリア（パレット） - レッドストーンブロック風テクスチャ */
    .blocklyFlyout {
      background-image: url('static/assets/red_stone_block_texture.png') !important;
      background-size: 64px 64px !important;
      background-repeat: repeat !important;
      image-rendering: pixelated !important;
      width: var(--flyout-width) !important;
    }

    /* ブロックエリア（フライアウト）の幅を調整 */
    .blocklyFlyoutBackground {
      width: var(--flyout-width) !important;
    }

    /* スクロールバーの位置を調整 (幅の増加分だけ右に寄せる) */
    .blocklyFlyout .blocklyScrollbarVertical {
      transform: translateX(calc(var(--flyout-width))) !important;
    }

    /* ブロックの表示範囲（SVG・クリップパス）を広げる */
    .blocklyFlyout .blocklyWorkspaceSVG,
    .blocklyFlyout svg,
    .blocklyFlyout .blocklyBlockCanvas,
    .blocklyFlyout .blocklyBubbleCanvas {
      width: var(--flyout-width) !important;
    }

    /* クリップパスと内部要素の表示矩形を広げる */
    .blocklyFlyout clipPath rect,
    .blocklyFlyout .blocklyWorkspaceSVG rect {
      width: var(--flyout-width) !important;
    }

    /* ピクセルアート風のシャープなレンダリング */
    img[src*="texture"],
    [class*="menu-bar"],
    .blocklySvg {
      image-rendering: -moz-crisp-edges !important;
      image-rendering: -webkit-crisp-edges !important;
      image-rendering: pixelated !important;
      image-rendering: crisp-edges !important;
    }

    /* ブロックエリアの白みオーバーレイ（調整可能） */
    .blocklyFlyoutBackground {
      fill: #ffffff !important;
      fill-opacity: var(--flyout-overlay-opacity) !important;
    }

    /* ブロックエリアのカテゴリ名（動き、変数、Minecraftなど）の文字色を白色に */
    .blocklyFlyoutLabelText {
      fill: #ffffff !important;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8) !important;
    }

    /* 「変数を作る」「リストをつくる」「ブロックをつくる」ボタンの文字色を白色に */
    .blocklyFlyoutButton .blocklyText {
      fill: #ffffff !important;
    }

    /* 「変数を作る」「リストをつくる」「ブロックをつくる」ボタンのホバー時背景色を黒に */
    .blocklyFlyoutButton:hover {
      fill: #000000 !important;
    }

    /* 拡張機能追加ボタンを非表示 (generic class targeting) */
    /* Assuming button has class like 'extension-library_extension-button_...' or aria-label */
    [class*="extension-library_extension-button"],
    button[aria-label="Add Extension"],
    button[aria-label="拡張機能を追加"] {
      display: none !important;
    }

    /* チュートリアルメニュー完全非表示 */
    [class*="menu-bar_help-menu"],
    [aria-label="Tutorials"],
    [aria-label="チュートリアル"] {
      display: none !important;
    }

    /* ロゴのリンク無効化 (視覚的) */
    [class*="menu-bar_scratch-logo"] {
      pointer-events: none !important;
      cursor: default !important;
    }

    /* ===== ドロップダウンメニューのスタイル変更 (ファイル・編集など) ===== */
    [class*="menu_menu"] {
      background-image: url('static/assets/stone_block_texture.png') !important;
      background-size: 64px 64px !important;
      background-repeat: repeat !important;
      border: 3px solid #1a3d10 !important;
      box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5) !important;
      image-rendering: pixelated !important;
    }

    /* メニュー項目のテキスト */
    [class*="menu_menu"] * {
      color: #ffffff !important;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8) !important;
    }

    /* ホバー時のハイライト調整 (オプション) */
    [class*="menu_menu-item"]:hover {
      background-color: rgba(0, 0, 0, 0.3) !important;
    }
  </style>
</head>

<body>
  <script>
    // ハック: 拡張機能を自動ロード & ロゴリンク無効化
    (function () {
      // 1. ロゴリンク無効化
      // DOMが読み込まれたタイミングを狙う（やや遅延させる）
      window.onload = function () {
        setTimeout(function () {
          var logo = document.querySelector('[class*="menu-bar_scratch-logo"]');
          if (logo) {
            logo.addEventListener('click', function (e) {
              e.preventDefault();
              e.stopPropagation();
              return false;
            });
            // 親の<a>タグがある場合
            var parentLink = logo.closest('a');
            if (parentLink) {
              parentLink.href = 'javascript:void(0)';
              parentLink.addEventListener('click', function (e) {
                e.preventDefault();
              });
            }
          }
        }, 1000);
      };

      // 2. Minecraft拡張機能の自動ロード (URLパラメータリダイレクト)
      // Scratchは ?extension=minecraft または ?extensionId=minecraft で起動時に拡張機能をロードする機能を持つ

      try {
        var params = new URLSearchParams(window.location.search);
        var EXTENSION_ID = 'minecraft'; // 拡張機能IDを確認済みであればここに。不明なら一旦 'minecraft' 等を試す。
        // ※ 拡張機能の本当のIDが分からないとロードされません。'minecraft', 'extension', 'microbit' etc.
        //   もしIDが間違っているとエラーになるかもですが、パラメータなしよりはマシです。

        if (!params.has('extension') && !params.has('extensionId')) {
          // パラメータを追加してリロード
          // 無限ループを防ぐため、sessionStorageなども使えるが、
          // 今回は simple にパラメータ有無だけで判断。

          // 現在のURLを取得
          var currentUrl = new URL(window.location.href);
          currentUrl.searchParams.set('extension', EXTENSION_ID);

          // リダイレクト (履歴に残さない場合は replace)
          window.location.replace(currentUrl.toString());
        }
      } catch (e) {
        console.error('Auto-load extension script error:', e);
      }

      // 3. 緑の旗と停止ボタンをメニューバーに移動
      // ステージが非表示のため、ボタンも隠れてしまっているので、
      // DOMツリー上でメニューバー直下に移動させて表示させる。
      setInterval(function () {
        try {
          // 移動先のコンテナを作成（なければ）
          // メニューバーを取得
          var menuBar = document.querySelector('[class*="menu-bar_menu-bar"]');
          if (!menuBar) return;

          var buttonContainerId = 'custom-controls-container';
          var buttonContainer = document.getElementById(buttonContainerId);

          if (!buttonContainer) {
            buttonContainer = document.createElement('div');
            buttonContainer.id = buttonContainerId;
            buttonContainer.style.display = 'flex';
            buttonContainer.style.alignItems = 'center';
            buttonContainer.style.position = 'absolute'; // 絶対配置にする
            buttonContainer.style.left = '52%';
            buttonContainer.style.top = '50%'; // 上下中央配置
            buttonContainer.style.transform = 'translate(-50%, -50%)'; // 中心を基準にする
            buttonContainer.style.zIndex = '1000';

            // メニューバーに追加
            // "左詰め" という要望なので、ロゴやファイルメニューの右側（= 空いているスペースの左端）に追加する。
            // ロゴの後に挿入してみる。
            var logo = menuBar.querySelector('[class*="menu-bar_scratch-logo"]');
            if (logo && logo.nextSibling) {
              // ロゴの次の要素の前（=ロゴの直後）に挿入... だが、
              // 単純に appendChild しても、flex-direction: row なら右に追加される。
              // 他の要素（ファイル、編集など）との兼ね合いがあるが、
              // とりあえず appendChild してから order で調整するか、自然な位置（右側）に置くか。
              // "空いているスペースに、左詰めで" -> 通常のメニュー項目の右側に配置されればOKと解釈。
              // ただし、右端（アカウント情報など）よりは左に置きたい。
              // アカウント情報はCSSで消しているので、実質的に右側は空いているはず。
              menuBar.appendChild(buttonContainer);
            } else {
              menuBar.appendChild(buttonContainer);
            }
          }

          // 緑の旗と停止ボタンを探す
          // セレクタは Scratch 3.0 のクラス名規則に準拠
          var greenFlag = document.querySelector('[class*="green-flag_green-flag"]');
          var stopAll = document.querySelector('[class*="stop-all_stop-all"]');

          // 緑の旗を移動
          if (greenFlag && greenFlag.parentNode !== buttonContainer) {
            buttonContainer.appendChild(greenFlag);
            // スタイル調整（メニューバーに収まるサイズに）
            greenFlag.style.width = '2rem';
            greenFlag.style.height = '2rem';
            greenFlag.style.padding = '0.25rem';
            greenFlag.style.marginRight = '0.5rem';
            greenFlag.style.cursor = 'pointer';
            // 視認性向上: 不透明度100% + 白色縁取り/光彩
            greenFlag.style.opacity = '1';
            greenFlag.style.filter = 'drop-shadow(0 0 2px rgba(255,255,255,0.8))';
            greenFlag.style.border = '2px solid rgba(255, 255, 255, 0.5)';
            greenFlag.style.borderRadius = '50%';
            greenFlag.style.backgroundColor = 'rgba(0, 0, 0, 0.2)'; // 背景を少し暗くしてコントラスト比を上げる
          }

          // 停止ボタンを移動
          if (stopAll && stopAll.parentNode !== buttonContainer) {
            buttonContainer.appendChild(stopAll);
            // スタイル調整
            stopAll.style.width = '2rem';
            stopAll.style.height = '2rem';
            stopAll.style.padding = '0.25rem';
            stopAll.style.cursor = 'pointer';
            // 視認性向上: 不透明度100% + 白色縁取り/光彩
            stopAll.style.opacity = '1';
            stopAll.style.filter = 'drop-shadow(0 0 2px rgba(255,255,255,0.8))';
            stopAll.style.border = '2px solid rgba(255, 255, 255, 0.5)';
            stopAll.style.borderRadius = '50%';
            stopAll.style.backgroundColor = 'rgba(0, 0, 0, 0.2)';
          }

        } catch (e) {
          console.error('Controls move script error:', e);
        }
      }, 500);
    })();
  </script>

  <script type="text/javascript" src="lib.min.js"></script>
  <script type="text/javascript" src="chunks/gui.js"></script>
</body>
